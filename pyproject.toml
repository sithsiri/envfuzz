[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envfuzz"
version = "0.1.0"
description = "Deterministic, CPU-only environment fuzzing for small autonomous robots"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["pydantic>=2.0", "PyYAML>=6.0", "typer>=0.9"]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.100", "coverage[toml]>=7.4"]
lint = ["ruff==0.17.4", "actionlint-py==1.7.12.25", "shellcheck-py==0.11.0.1"]

[project.scripts]
envfuzz = "envfuzz.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires a running ROS 2 and Gazebo environment"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit selection so results do not depend on the ruff release's defaults.
# Deferred until src/ is cleaned up: E501 line length, I001 import order, UP and B.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["envfuzz"]

[tool.coverage.report]
# P3-09 default coverage target for src/.
fail_under = 85

