[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envfuzz"
version = "0.1.0"
description = "Deterministic, CPU-only environment fuzzing for small autonomous robots"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["pydantic>=2.0", "PyYAML>=6.0", "typer>=0.9"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
envfuzz = "envfuzz.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

